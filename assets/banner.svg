<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460" role="img" aria-labelledby="title desc">
  <title id="title">NEMESIS banner</title>
  <desc id="desc">Dark cyber security banner for NEMESIS showing a containment core, attribution graph, pursuit path, and the project wordmark.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071018"/>
      <stop offset="0.55" stop-color="#0A1720"/>
      <stop offset="1" stop-color="#061017"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#51E5FF"/>
      <stop offset="0.52" stop-color="#65F1B8"/>
      <stop offset="1" stop-color="#D9FF7B"/>
    </linearGradient>
    <linearGradient id="accentDim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#51E5FF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#65F1B8" stop-opacity="0.06"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#51E5FF" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#51E5FF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#51E5FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#9CC7D3" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <pattern id="microgrid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 0H0V10" fill="none" stroke="#9CC7D3" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="tinyGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="roundClip">
      <rect x="18" y="18" width="1564" height="424" rx="28"/>
    </clipPath>
  </defs>

  <rect width="1600" height="460" fill="#050B10"/>
  <g clip-path="url(#roundClip)">
    <rect x="18" y="18" width="1564" height="424" rx="28" fill="url(#bg)"/>
    <rect x="18" y="18" width="1564" height="424" rx="28" fill="url(#grid)"/>
    <rect x="18" y="18" width="1564" height="424" rx="28" fill="url(#microgrid)"/>

    <!-- subtle left-to-right depth -->
    <path d="M-70 410 C320 270 470 560 890 355 S1310 95 1700 180" fill="none" stroke="#42D9FF" stroke-opacity="0.045" stroke-width="130"/>
    <path d="M230 -80 C500 90 670 65 930 180 S1370 360 1680 210" fill="none" stroke="#79FFB0" stroke-opacity="0.03" stroke-width="95"/>

    <!-- left copy -->
    <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <g transform="translate(86 70)">
        <rect x="0" y="0" width="124" height="30" rx="15" fill="#0D222B" stroke="#4EDFF8" stroke-opacity="0.35"/>
        <circle cx="16" cy="15" r="4" fill="#65F1B8" filter="url(#tinyGlow)">
          <animate attributeName="r" values="3.5;5.8;3.5" dur="2.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.65;1;0.65" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <text x="29" y="20" fill="#BDE9F3" font-size="12" font-weight="700" letter-spacing="2.2">NEMESIS</text>
      </g>

      <text x="82" y="205" fill="#F5FBFD" font-size="92" font-weight="800" letter-spacing="12">NEMESIS</text>
      <rect x="84" y="226" width="590" height="4" rx="2" fill="url(#accent)"/>
      <rect x="84" y="226" width="72" height="4" rx="2" fill="#F5FFFF" opacity="0.1">
        <animate attributeName="x" values="84;602;84" keyTimes="0;0.72;1" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.58;0" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"/>
      </rect>

      <text x="84" y="275" fill="#A9C2CC" font-size="20" font-weight="500" letter-spacing="2.1">AUTONOMOUS ADVERSARY PURSUIT &amp; ATTRIBUTION</text>
      <text x="84" y="311" fill="#70909C" font-size="14" font-weight="500" letter-spacing="1.2">BOUND AUTONOMY  /  SEALED EVIDENCE  /  HUMAN AUTHORITY</text>

      <g transform="translate(84 357)" font-size="12" font-weight="700" letter-spacing="1.3">
        <text x="0" y="0" fill="#7C9CA8">DETECT</text>
        <path d="M66 -4H94" stroke="#4EDFF8" stroke-opacity="0.45"/>
        <circle cx="94" cy="-4" r="2" fill="#51E5FF"/>
        <text x="112" y="0" fill="#8DB0BA">PURSUE</text>
        <path d="M181 -4H209" stroke="#4EDFF8" stroke-opacity="0.45"/>
        <circle cx="209" cy="-4" r="2" fill="#51E5FF"/>
        <text x="227" y="0" fill="#A1C2C7">ATTRIBUTE</text>
        <path d="M321 -4H349" stroke="#65F1B8" stroke-opacity="0.55"/>
        <circle cx="349" cy="-4" r="2" fill="#65F1B8"/>
        <text x="367" y="0" fill="#B5D6CE">DISRUPT</text>
        <path d="M445 -4H473" stroke="#9BF09C" stroke-opacity="0.55"/>
        <circle cx="473" cy="-4" r="2" fill="#A4F28A"/>
        <text x="491" y="0" fill="#CBE4B4">WATCH</text>
      </g>
    </g>

    <!-- right technical visual -->
    <g transform="translate(1075 230)">
      <circle r="245" fill="url(#halo)">
        <animate attributeName="opacity" values="0.68;1;0.68" dur="5.5s" repeatCount="indefinite"/>
      </circle>

      <!-- orbit / containment rings -->
      <circle r="152" fill="none" stroke="#5DE6FF" stroke-opacity="0.16" stroke-width="1.4" stroke-dasharray="7 8">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
      </circle>
      <circle r="121" fill="none" stroke="#65F1B8" stroke-opacity="0.23" stroke-width="1.2">
        <animate attributeName="stroke-opacity" values="0.16;0.42;0.16" dur="4.8s" repeatCount="indefinite"/>
      </circle>
      <circle r="88" fill="#081821" stroke="#71F0C3" stroke-opacity="0.65" stroke-width="1.6">
        <animate attributeName="stroke-opacity" values="0.45;0.9;0.45" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <circle r="72" fill="none" stroke="#70EAF9" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="3 6">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite"/>
      </circle>

      <!-- directional arcs -->
      <path d="M-146 -42 A152 152 0 0 1 15 -151" fill="none" stroke="#51E5FF" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7"/>
      <path d="M129 80 A152 152 0 0 1 68 136" fill="none" stroke="#9EFF8A" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8"/>
      <circle cx="14" cy="-151" r="5" fill="#51E5FF" filter="url(#tinyGlow)">
        <animate attributeName="opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="68" cy="136" r="5" fill="#9EFF8A" filter="url(#tinyGlow)">
        <animate attributeName="opacity" values="1;0.45;1" dur="2.6s" repeatCount="indefinite"/>
      </circle>

      <!-- animated pursuit tracers -->
      <path d="M-146 -42 A152 152 0 0 1 15 -151" fill="none" stroke="#C8FAFF" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="18 235" stroke-opacity="0.78">
        <animate attributeName="stroke-dashoffset" from="253" to="0" dur="3.8s" repeatCount="indefinite"/>
      </path>
      <path d="M129 80 A152 152 0 0 1 68 136" fill="none" stroke="#E3FFC0" stroke-width="3" stroke-linecap="round" stroke-dasharray="12 95" stroke-opacity="0.75">
        <animate attributeName="stroke-dashoffset" from="107" to="0" dur="2.8s" repeatCount="indefinite"/>
      </path>

      <!-- graph connections -->
      <g fill="none" stroke="#79DDEC" stroke-width="1.1" stroke-opacity="0.27">
        <path d="M-247 -115 L-176 -64 L-149 9 L-79 36"/>
        <path d="M-230 64 L-149 9"/>
        <path d="M-195 141 L-132 104 L-79 36"/>
        <path d="M195 -137 L131 -93 L88 -52"/>
        <path d="M255 -32 L166 4 L88 -52"/>
        <path d="M219 114 L143 80 L88 -52"/>
        <path d="M-176 -64 L-113 -111 L-31 -85"/>
        <path d="M131 -93 L65 -120 L-31 -85"/>
        <path d="M-132 104 L-66 130 L13 88"/>
        <path d="M143 80 L81 127 L13 88"/>
      </g>

      <!-- moving graph packets -->
      <g filter="url(#tinyGlow)">
        <circle r="2.8" fill="#51E5FF">
          <animateMotion path="M-247 -115 L-176 -64 L-149 9 L-79 36" dur="4.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.84;1" dur="4.4s" repeatCount="indefinite"/>
        </circle>
        <circle r="2.6" fill="#65F1B8">
          <animateMotion path="M195 -137 L131 -93 L88 -52" dur="3.8s" begin="0.8s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.84;1" dur="3.8s" begin="0.8s" repeatCount="indefinite"/>
        </circle>
        <circle r="2.4" fill="#D9FF7B">
          <animateMotion path="M-195 141 L-132 104 L-79 36" dur="4.8s" begin="1.6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.84;1" dur="4.8s" begin="1.6s" repeatCount="indefinite"/>
        </circle>
        <circle r="2.4" fill="#A7F6FF">
          <animateMotion path="M255 -32 L166 4 L88 -52" dur="4.1s" begin="2.2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.84;1" dur="4.1s" begin="2.2s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- graph nodes -->
      <g fill="#0A1E27" stroke="#58DFF5" stroke-width="1.2">
        <circle cx="-247" cy="-115" r="7"/>
        <circle cx="-176" cy="-64" r="5"/>
        <circle cx="-230" cy="64" r="6"/>
        <circle cx="-195" cy="141" r="5"/>
        <circle cx="-149" cy="9" r="7"/>
        <circle cx="-132" cy="104" r="5"/>
        <circle cx="195" cy="-137" r="6"/>
        <circle cx="255" cy="-32" r="5"/>
        <circle cx="219" cy="114" r="7"/>
        <circle cx="131" cy="-93" r="5"/>
        <circle cx="143" cy="80" r="5"/>
      </g>
      <g fill="#68F1BB">
        <circle cx="-113" cy="-111" r="4"/>
        <circle cx="65" cy="-120" r="4"/>
        <circle cx="-66" cy="130" r="4"/>
        <circle cx="81" cy="127" r="4"/>
      </g>

      <!-- central N / limiter mark -->
      <g opacity="0.28" filter="url(#softGlow)">
        <path d="M-46 42 V-42 H-25 L24 20 V-42 H46 V42 H24 L-24 -20 V42 Z" fill="none" stroke="url(#accent)" stroke-width="14" stroke-linejoin="round"/>
        <animate attributeName="opacity" values="0.14;0.52;0.14" dur="3.2s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="scale" values="0.98;1.035;0.98" dur="3.2s" repeatCount="indefinite"/>
      </g>
      <g filter="url(#softGlow)">
        <path d="M-46 42 V-42 H-25 L24 20 V-42 H46 V42 H24 L-24 -20 V42 Z" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linejoin="round"/>
      </g>

      <!-- seam markers -->
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1.1" fill="#7FA8B4">
        <text x="-49" y="-184">PILOT</text>
        <text x="108" y="-148">SEAM</text>
        <text x="180" y="30">LIMITER</text>
        <text x="95" y="164">AUTH</text>
        <text x="-205" y="184">EVIDENCE</text>
      </g>

      <!-- tiny crosshair -->
      <g stroke="#D9FF7B" stroke-opacity="0.8" stroke-width="1.2">
        <circle cx="255" cy="-32" r="11" fill="none">
          <animate attributeName="r" values="9;18;9" dur="2.8s" repeatCount="indefinite"/>
          <animate attributeName="stroke-opacity" values="0.9;0.18;0.9" dur="2.8s" repeatCount="indefinite"/>
        </circle>
        <path d="M255 -49V-42 M255 -22V-15 M238 -32H245 M265 -32H272"/>
      </g>
    </g>

    <!-- corner telemetry -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#52727F" letter-spacing="1.25">
      <text x="1295" y="409">GRAPH / PROVENANCE / CONTROL</text>
      <text x="84" y="414">NETWORKED ENGINE FOR MALICIOUS ENTITY SURVEILLANCE, IDENTIFICATION &amp; SUPPRESSION</text>
    </g>

    <!-- top right status strip -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1">
      <rect x="1310" y="58" width="188" height="28" rx="14" fill="#0A1A21" stroke="#78EEC1" stroke-opacity="0.22"/>
      <circle cx="1328" cy="72" r="4" fill="#65F1B8">
        <animate attributeName="r" values="3.4;5.3;3.4" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
      <text x="1342" y="76" fill="#83AAB4">MODEL ≠ AUTHORITY
        <animate attributeName="fill" values="#83AAB4;#B7E6DE;#83AAB4" dur="7s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>

  <rect x="18.5" y="18.5" width="1563" height="423" rx="27.5" fill="none" stroke="#BCD6DD" stroke-opacity="0.09"/>
</svg>
